services:
  zero:
    build: .
    env_file:
      - .env
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - nuclei-templates:/home/zero/nuclei-templates
    command: ["worker"]
    restart: unless-stopped

  api:
    build: .
    env_file:
      - .env
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      ZERO_API_ADDR: "0.0.0.0:8080"
    command: ["api"]
    volumes:
      - nuclei-templates:/home/zero/nuclei-templates
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    env_file:
      - .env
    environment:
      ZERO_DASHBOARD_ADDR: "0.0.0.0:8090"
      ZERO_DASHBOARD_API_BASE_URL: "http://api:8080"
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  migrate:
    build: .
    env_file:
      - .env
    dns:
      - 1.1.1.1
      - 8.8.8.8
    command: ["migrate", "up"]
    profiles:
      - tools

volumes:
  nuclei-templates:
